name: Configure Stripe sandbox

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'
  push:
    branches: [main]
    paths:
      - scripts/sync-stripe.mjs
      - tests/stripe.test.mjs
      - .github/workflows/stripe-sandbox.yml

permissions:
  contents: write

concurrency:
  group: stripe-sandbox
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Create or reuse sandbox checkout and portal links
        run: node scripts/sync-stripe.mjs
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'https://coach-rj.com' }}
      - run: npm run build
      - name: Publish public links for the existing Cloudflare Git deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stripe-config.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public Stripe sandbox links"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
