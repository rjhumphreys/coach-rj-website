  <style>
    /* Full-screen carousel visuals: fade between background images and center overlay content */
    .hero-fullwidth { position: relative; height: 100vh; min-height: 100vh; overflow: hidden; }
    .hero-carousel { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hero-carousel .hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 900ms ease-in-out; }
    .hero-carousel .hero-bg.active { opacity: 1; z-index: 1; }

    /* Overlay sits on top of images and centers content */
    .hero-overlay { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .hero-content { pointer-events: auto; color: #fff; text-align: center; padding: 2rem; max-width: 980px; }

    /* Optional: subtle gradient to improve text contrast */
    .hero-overlay::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.35)); z-index: 1; }
    .hero-content { position: relative; z-index: 2; }

    /* Make sure header sits above the hero when fixed (if needed) */
    .site-header { position: relative; z-index: 3; }
  </style>
